data_dir: data
data_cleanup_enabled: true
data_retention_hours: 24
data_cleanup_interval_seconds: 300

sources:
  enabled_assets:
    - BTC
    - ETH
  # Windows system proxy is used by default; set this only for a manual fallback.
  proxy_url:
  market_slug: btc-updown-5m-1783704300
  binance_symbol: BTCUSDT
  binance_rest_url: https://api.binance.com
  binance_ws_url: wss://stream.binance.com:9443/ws/btcusdt@trade
  binance_signal_ws_url: wss://stream.binance.com:9443/stream
  binance_futures_rest_url: https://fapi.binance.com
  binance_futures_ws_url: wss://fstream.binance.com/stream
  coinbase_rest_url: https://api.exchange.coinbase.com
  coinbase_ws_url: wss://ws-feed.exchange.coinbase.com
  kraken_ws_url: wss://ws.kraken.com/v2
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  clob_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  rtds_ws_url: wss://ws-live-data.polymarket.com
  rtds_stale_seconds: 10
  threshold_page_timeout_seconds: 4
  threshold_page_retry_seconds: 0.75
  poly_book_poll_ms: 200
  market_refresh_seconds: 0.5
  max_start_price_lag_ms: 2000
  market_slug_patterns:
    - bitcoin
    - btc
    - up-or-down
    - updown
  observe_only_on_unverified_settlement: true

strategy:
  min_entry_edge_usd: 10
  stop_edge_usd: 10
  min_buy_price: 0.10
  max_buy_price: 0.75
  take_profit_ticks: 0.10
  min_profit_after_slippage: 0.04
  min_seconds_to_entry: 10
  max_seconds_to_entry: 240
  force_exit_seconds: 5
  book_direction_exit_delay_seconds: 10
  reverse_entry_enabled: false
  entry_confirmation_enabled: true
  entry_confirmation_seconds: 1
  entry_confirmation_updates: 3
  taker_fee_rate: 0.07

risk:
  max_order_usd: 10
  max_market_usd: 30
  max_data_age_ms: 1000
  max_hold_seconds: 120
  max_loss_usd: 2.5
  max_trades_per_market: 1

pair_match:
  enabled: false
  # Total quote target is 2x this value; both legs receive exactly the same shares.
  leg_quote_usd: 10
  min_spread_cents: 0
  # Used only for the second order in per_market_two_stage mode.
  second_order_min_spread_cents: 0
  # Absolute difference between the two simulated execution averages.
  min_leg_price_gap_cents: 0
  start_seconds_after_open: 20
  end_seconds_after_open: 280
  max_pairs_per_market: 1
  alternate_directions: true
  # per_market: best first; per_market_two_stage: best first, then opposite with its own spread.
  # per_market_two_stage always forces strict alternation and max_pairs_per_market=2.
  # per_market_ab/per_market_ba: fixed first direction, then alternate.
  # Sequence modes default max_pairs_per_market to 2 when that field is omitted.
  # continuous_abab: alternate forever; always_a/always_b: fixed direction.
  alternation_mode: per_market

btc_recovery:
  enabled: false
  # All prices are cents. Initial entry buys the live book on an upward breakout.
  # Once recovery triggers, the reverse quantity also buys at the live book.
  entry_price_cents: 70
  max_entry_price_cents: 100  # 100 disables the initial entry price cap.
  target_price_cents: 80  # 100 disables the initial take-profit exit.
  recovery_target_price_cents: 80
  # When recovery orders are stopped, 0 disables the initial stop-loss.
  recovery_trigger_cents: 40
  stop_price_cents: 30
  initial_quantity: 5
  recovery_quantity: 15
  # The strategy observes entries only inside [entry, exit).
  entry_seconds_after_open: 0
  exit_seconds_after_open: 300

btc_dynamic:
  # Online probability controls both direction and a per-direction dynamic limit.
  # This strategy is local simulation only and holds every fill to official settlement.
  enabled: false
  sizing_mode: quantity
  quantity: 10
  quote_amount_usd: 5
  entry_seconds_after_open: 270
  exit_seconds_after_open: 290
  min_net_edge_cents: 3
  slippage_reserve_cents: 1.35
  confirmation_seconds: 2
  confirmation_updates: 2
  loss_streak_limit: 5
  loss_cooldown_minutes: 30
  short_volatility_window_seconds: 10
  long_volatility_window_seconds: 60
  volatility_floor_bps: 0.5
  max_probability_correction_points: 10

btc_v8:
  # Independent multi-exchange local simulation; no real-order adapter is used.
  enabled: false
  # When enabled, model EV controls buy/sell thresholds; hard risk controls remain active.
  auto_decision_mode: false
  # Short-horizon local simulation driven by spot moves that lead Chainlink/Polymarket.
  orderbook_chase_mode: false
  auto_emergency_loss_enabled: false
  quote_amount_usd: 5
  buy_edge_cents: 5
  sell_edge_cents: 2
  slippage_reserve_cents: 1.35
  entry_end_seconds: 285
  sell_end_seconds: 298
  buy_confirmation_seconds: 2
  buy_confirmation_updates: 2
  sell_confirmation_seconds: 1
  sell_confirmation_updates: 2
  reentry_cooldown_seconds: 3
  max_entries_per_market: 3
  max_loss_usd: 2.5
  chase_take_profit_arm_usd: 0.25
  chase_take_profit_drawdown_usd: 0.15
  chase_take_profit_drawdown_fraction: 0.35
  evaluation_interval_ms: 250
  snapshot_interval_seconds: 1
  spot_exchanges:
    - binance
    - coinbase
    - kraken
  min_fresh_spot_exchanges: 2
  spot_stale_seconds: 2
  chainlink_stale_seconds: 10
  raw_retention_hours: 24
  snapshot_retention_hours: 24
  short_volatility_window_seconds: 10
  long_volatility_window_seconds: 60
  volatility_floor_bps: 0.5
  max_probability_correction_points: 10

real_trading:
  # Real execution follows only the BTC recovery initial-order signal.
  # The process always starts disarmed and in shadow mode.
  enabled: false
  order_quantity: 1
  max_order_notional_usd: 5
  daily_loss_limit_usd: 10
  max_orders_per_day: 10
  auto_redeem: true
  shadow_required_signals: 20
